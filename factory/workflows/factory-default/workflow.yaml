name: factory-default
description: Pipeline local migrado (triage -> spec -> aprobación -> implement -> verify -> review)
tags:
  - factory
  - defaults
inputs:
  request:
    required: true
    description: Qué hay que hacer (texto o URL de issue)
returns: review
outcome_field: green
nodes:
  - id: triage
    command: triage
    agent: triage

  - id: spec
    depends_on: [triage]
    command: spec
    agent: spec

  - id: approve
    depends_on: [spec]
    approval:
      message: |
        Aprobar la spec para pasar a implementación?

        $spec.output
      capture_response: true
      on_reject:
        prompt: |
          Ajustá la spec según el rechazo humano y devolvé la spec corregida.

          Rechazo: $REJECTION_REASON
          Spec actual: $spec.output
        max_attempts: 2

  - id: implement
    depends_on: [approve]
    command: implement
    agent: implement

  - id: verify
    depends_on: [implement]
    command: verify
    agent: implement
    output_type: verify-evidence

  - id: review
    depends_on: [verify]
    command: review
    agent: review
    output_format:
      type: object
      properties:
        green: { type: boolean }
        findings: { type: string }
      required: [green, findings]
