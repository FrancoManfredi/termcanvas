# FU-4 seals (additive scalars, validated by the loader + `yaml-cost-rates`):
# ratesAsOf = tariff effective date (YYYY-MM-DD, bump it in the ritual step 3).
# ratesSource = where the numbers came from (documented only, never fetched).
ratesAsOf: "2026-09-05"
ratesSource: "https://opencode.ai/docs/go/"

# Sesiones de agente (Ola 16, continuidad conversacional): true = UNA sesión
# por (job, rol) reutilizada entre turnos, con renovación lazy visible ante
# daemon reiniciado ("sesión renovada (la anterior expiró)").
# false = comportamiento viejo exacto (sesión nueva por llamada). Regla 8.
agentSessions: true

# Re-verificación del reviewer (Ola 17, review que re-valida): true = un
# veredicto `revise` con pedido `reverify` válido dispara UNA verificación
# enfocada (allowlist cerrada) antes de volver a Building, dentro del budget
# de 2 revisiones. false = revise clásico exacto (cero ejecuciones). Regla 8.
reviewerReverify: true

# Auto-propose de self-improvement (Ola 18 P1.4, features a medio cablear):
# máx de propuestas `pending|ready` abiertas por scorer antes de frenar el
# auto-propose (default 1). 0 = auto-propose apagado (el scoring manual y
# `createProposal` manual siguen intactos). Regla 8, estilo `samplingRate: 0`.
improveProposalCooldown: 1

# Notificaciones locales (Ola 19, centro de notificaciones + toast OS):
# notificationsEnabled false = centro apagado total (notify no-op null, el
# GET devuelve `notifications: []` pero el store NO borra). Regla 8.
# osNotifications false = sin toast OS nativo (el centro sigue guardando;
# solo la campana/panel lo muestran). Regla 8.
notificationsEnabled: true
osNotifications: true

# Triage on-demand (T2): cuándo corre el Triage-agent.
# auto = el foreman decide primero con el issue completo; el triage-agent
#   corre SOLO si el foreman dice needs_triage/needs_input (para formular
#   preguntas). Un issue claro cuesta 1 llamada LLM en vez de 2. Default.
# always = régimen anterior exacto (pre-triage siempre antes del foreman).
# never = jamás corre el triage-agent (needs_triage parquea directo).
# Regla 8.
triageMode: auto

# Automations (Wave 14, triggers without risk): enabled false = no trigger
# fires (ticks are skipped); tickMs 0 = ticker fully off; each trigger
# honors its own enabled + maxFires (0 = never fires) + cooldownMs between
# fires. Rules 7-8.
automations:
  enabled: true
  tickMs: 30000
  triggers:
    - name: "nightly-trivial"
      kind: "schedule"
      enabled: true
      intervalMs: 86400000
      promptRef: "factory/prompts/nightly.md"
      maxFires: 5
      cooldownMs: 3600000
    - name: "announce-ask-human"
      kind: "event"
      enabled: true
      on: "ask_human"
      action: "notify-integration"
      maxFires: 20
      cooldownMs: 60000

# Integrations (Wave 14, local mock without secrets): enabled false =
# outbound posts are refused with an honest 409. P0 accepts ONLY
# mode "mock-local" and provider "linear"; any secret field
# (token/secret/webhook/...) is rejected by the validator. Rule 8.
integrations:
  enabled: true
  mode: "mock-local"
  provider: "linear"

# Live intake (F1 wiring, PLAN-100 PARIDAD §3.1): OPT-IN, default OFF.
# `liveMode: false` keeps the exact P0 mock-local behavior (same posts, same
# 409/400 gates). Live traffic resolves credentials from environment
# variable NAMES only — NEVER write secret values in this file. The
# validator (`integrations-live-*` rules) rejects secret-looking fields in
# every mode and demands a `vaultRef` env name when `liveMode` is true.
# The block is FLAT scalars only (the service reader is flat-only too):
# intake filters ride the webhook-in trigger, not this block (a nested
# `filter:` here shouts `integrations-live-filter`). Commented example
# (zero parser impact while commented):
#   live:
#     liveMode: false
#     provider: "linear"
#     vaultRef: "LINEAR_API_KEY"
#     webhookSecretRef: "LINEAR_WEBHOOK_SECRET"
#     allowPostBack: true

# Human-in-the-measure decisions (F3 wiring, PLAN-100 PARIDAD §4.3):
# conventions only — zero new keys in this task (comments only).
# - A benchmark DECISION is human-only (decidedBy human, never auto): it lives
#   beside its run as factory/.benchmark-results/<runId>.decision.json with a
#   trialsRef pointing at that run. The validator shouts on broken sidecars
#   (decisions-benchmark-record); a missing sidecar is valid (deciding is
#   optional — shouting is for broken evidence, never for absence).
# - A proposal is Adopted/Discarded by a human, optionally FROM its
#   proposal-ready notification (extract the imp-id, call the existing
#   adopt/discard route, ack the notification). Decided proposals must carry
#   decidedAt (decisions-proposal-link); auto* keys are forbidden anywhere.
# - F3-T3 added no benchmark/proposal route (route table +0, see
#   routing/routeTable.ts): record flows reuse create/get/adopt/discard/ack.
