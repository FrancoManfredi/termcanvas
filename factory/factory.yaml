# factory/factory.yaml — Ola 7 Agents as code (H4/H5).
# Fuente versionada de puertos, timeouts, modelos default y pares del revisor.
# Cambiar el comportamiento = cambiar este archivo + test, nunca editar TS a ciegas.
# Rollback = git revert.

# Puertos: espejo de FACTORY_DEFAULT_PORT / FACTORY_PORT_MAX (headless-runtime/factory/factoryServer.ts).
ports:
  factoryDefault: 17680
  factoryMax: 17690

# Timeouts en milisegundos — doctrina sin-límites: el ÚNICO que queda es el
# de verificación (cada paso test/build muere por este techo con kill en 2
# fases: seguridad de proceso, no límite de fase). Los turnos LLM viven hasta
# el fusible global GLOBAL_AGENT_FUSE_MS (headless-runtime/llm/agentTransport)
# y session.create hasta SESSION_CREATE_FUSE_MS: sin timeouts por fase.
# - verifyMs: IMPLEMENT_VERIFY_TIMEOUT_MS (shared/types/implement.ts, verify fail-fast test+build) — 120s por paso.
timeouts:
  verifyMs: 120000

# Modelos default: espejo de los fallbacks efectivos en código.
# - foreman / implement: default efectivo cuando el job no trae modelRef.
# - review: auto-disjoint documenta que lo resuelve reviewModelSelector (ver H4),
#   con override explícito reviewerRef cuando el usuario lo pide.
defaultModels:
  foreman: "opencode-go/muse-spark-1.2-contributor"
  implement: "opencode-go/muse-spark-1.2-contributor"
  review: "auto-disjoint"

# Pares builder -> revisor (H4): espejo EXACTO de REVIEWER_PAIRS
# (headless-runtime/review/reviewModelSelector.ts). El selector los lee de acá
# y usa las constantes solo como fallback si este archivo falta o es inválido.
reviewerPairs:
  - match: "muse-spark → big-pickle"
    reviewer: "opencode/big-pickle"
  - match: "big-pickle → muse-spark"
    reviewer: "opencode-go/muse-spark-1.2-contributor"
  - match: "anthropic/* → gpt-4o"
    reviewer: "openai/gpt-4o"
  - match: "openai/* → anthropic"
    reviewer: "anthropic/claude-sonnet-4-20250514"

# Scorers: samplingRate 25 vigente desde Ola 11, sin efecto hoy.
scorers:
  samplingRate: 25

# Runners (Ola 15, runners honestos): default usado por verificación/ejecución
# cuando el job no pide otro. windows-local = el daemon corre en Windows, sin
# aislamiento (honesto). Definiciones en factory/runners/<name>.yaml.
runners:
  default: "windows-local"

# Costo (Ola 15): costTracking false = no se estima nada (se muestra "—").
# costRates vacío = modo "sin tarifa" (se muestran llamadas+duración, NUNCA
# USD 0.00 como si fuera dato). Lo usa el módulo de costo (E2); solo entran
# acá tarifas confirmadas por el usuario, nunca números inventados.
costTracking: true

# F4 money track (PLAN-100 PARIDAD section 3.3, F4-T1): rate shape =
#   "provider/model":
#     inputUSDper1M: <number >= 0>
#     outputUSDper1M: <number >= 0>
# Rules: ONLY user-confirmed tariffs enter this map (never invent numbers
# here); `{}` stays VALID and means "sin tarifa" (calls shown, USD null,
# never 0.00 as data). The validator (`yaml-cost-rates` rule, CostRateSchema
# in headless-runtime/factory/definitionValidate.ts) rejects negative /
# non-finite values, unknown keys and missing fields with file:line.
#
# FU-4 (2026-09-05, source https://opencode.ai/docs/go/): 27 user-confirmed
# tariffs below. Keys are EXACT live modelKeys ("opencode-go/<model-id>",
# verified against defaultModels above and FACTORY_DEFAULTS in
# headless-runtime/factory/agentLoader.ts). Policy (documented, no exceptions):
# - ONLY the base branch per model: tier ≤ / off-peak / no Peak. Cache columns
#   and the "Uso" (subscription) column are IGNORED: the tracker estimates
#   tokens as floor(chars/4) with no cache split, and "Uso" is subscription
#   credit, not marginal USD — mixing it in would invent data (Regla 1).
# - Brief said "28 models" but lists 27 ids; the 27 below are implemented, no
#   28th was invented (see software-paridad-100/REPORT-FU4-tariffs.md).
# WEEKLY RITUAL (<2min, manual, zero automation by design — no network fetch
# in the daemon, no new intervals, Regla 8):
#   1. Open https://opencode.ai/docs/go/ and compare each pair below.
#   2. Update ONLY the numbers that changed (same keys, same shape).
#   3. Bump `ratesAsOf:` below to today's YYYY-MM-DD.
#   4. Run `node scripts/factory.mjs validate` (exit 0 = green).
# The badge tooltip shows `rates as of <date>` so staleness is visible.
