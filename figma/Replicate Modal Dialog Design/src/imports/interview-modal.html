  function renderQuestionText(text) {
    const lineas = text.split("\n");
    return lineas.map((linea, i) => {
      const inline = renderInlineLine(linea);
      return (i > 0 ? "<br>" : "") + inline;
    }).join("");
  }
  function renderInlineLine(linea) {
    const tokens = linea.split(/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g);
    return tokens.map((tok) => {
      if (tok.startsWith("**") && tok.endsWith("**") && tok.length > 4) {
        return `<strong>${esc(tok.slice(2, -2))}</strong>`;
      }
      if (tok.startsWith("`") && tok.endsWith("`") && tok.length > 2) {
        return `<code>${esc(tok.slice(1, -1))}</code>`;
      }
      if (tok.startsWith("*") && tok.endsWith("*") && tok.length > 2) {
        return `<em>${esc(tok.slice(1, -1))}</em>`;
      }
      return esc(tok);
    }).join("");
  }

    if (state.phase === "pick") return pickHtml();
    if (state.phase === "interview") return interviewHtml();

    if (state.phase === "done") return doneHtml();

  function render() {
    if (!state.open) {
      modalRoot.classList.add("hidden");
      modalRoot.innerHTML = "";
      $("#closeOpenBtn").textContent = "Abrir modal";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ════════════════════════════════════════════════════════════════
  //  ACCIONES (espejo de las del store real)
  // ════════════════════════════════════════════════════════════════
  function closeModal() { state.open = false; render(); }

  function setPhase(phase) {
    state.phase = phase;
    render();
  }

  function goToPick() {
    clearTimeout(state.synthTimer);
    state.phase = "pick";
    state.busy = false;
    state.qIndex = 0;
    state.history = [];
    state.selectedOptionId = null;
    state.freeText = "";
    state.canGoBack = false;
    render();
  }

  function startNew() {
    state.phase = "interview";
    state.busy = false;
    state.qIndex = 0;
    state.history = [];
    state.selectedOptionId = null;
    state.freeText = "";
    state.canGoBack = false;
    state.answered = 0;
    render();
  }

  function goToQuestion(idx) {
    state.qIndex = idx;
    state.selectedOptionId = null;
    state.freeText = "";
    state.canGoBack = state.history.length > 0;
    render();
  }

  function submitAnswer() {
    if (state.busy) return;
    if (state.selectedOptionId === null && state.freeText.trim().length === 0) return;
    const q = QUESTIONS[state.qIndex];
    state.history.push({
      qIndex: state.qIndex,
      selectedOptionId: state.selectedOptionId,
      freeText: state.freeText,
      topic: q.topic,
    });
    state.answered++;
    state.busy = true;
    render();
    // Simula la llamada al modelo (~900 ms)
    setTimeout(() => {
      state.busy = false;
      if (state.qIndex + 1 >= QUESTIONS.length) {
        state.phase = "synthesizing";
        render();
        clearTimeout(state.synthTimer);
        state.synthTimer = setTimeout(() => {
          state.phase = "done";
          state.doneReason = "all_topics_closed";
          state.ledgerPath = ".agents/interview/interview-1755202000000.json";
          render();
        }, 1600);
      } else {
        goToQuestion(state.qIndex + 1);
      }
    }, 900);
  }

  function goBack() {
    const prev = state.history.pop();
    if (!prev) return;
    state.qIndex = prev.qIndex;
    state.selectedOptionId = prev.selectedOptionId;
    state.freeText = prev.freeText;
    state.answered = Math.max(0, state.answered - 1);
    state.canGoBack = state.history.length > 0;
    render();
  }

  function resumeFrom(path, completed) {
    const row = [...state.summaries.enProgreso, ...state.summaries.completadas, ...state.summaries.vacias]
      .find((s) => s.ledgerPath === path);
    if (!row) return;
    if (completed) {
      state.phase = "done";
      state.doneReason = "all_topics_closed";
      state.ledgerPath = row.ledgerPath;
      state.busy = false;
      render();
      return;
    }
    state.phase = "interview";
    state.busy = false;
    state.qIndex = row.answers_count % QUESTIONS.length;
    state.history = [];
    state.selectedOptionId = null;
    state.freeText = "";
    state.canGoBack = false;
    state.answered = row.answers_count;
    render();
  }

  function deleteRow(path) {
    if (!confirm("¿Eliminar esta entrevista? El ledger se borra del disco.")) return;
    state.summaries.enProgreso = state.summaries.enProgreso.filter((s) => s.ledgerPath !== path);
    state.summaries.completadas = state.summaries.completadas.filter((s) => s.ledgerPath !== path);
    state.summaries.vacias = state.summaries.vacias.filter((s) => s.ledgerPath !== path);
    render();
  }

  function goContext() {
    $("#note").textContent = "En la app real esto abre el modal de contexto (mirá figma/repo-context-modal.html).";
  }

  // ════════════════════════════════════════════════════════════════
  //  EVENTOS
  // ════════════════════════════════════════════════════════════════
  modalRoot.addEventListener("click", (e) => {
    if (e.target === modalRoot) { closeModal(); return; }
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    switch (btn.dataset.action) {
      case "close": closeModal(); break;
      case "backToPick": goToPick(); break;
      case "new": startNew(); break;
      case "resume": resumeFrom(btn.dataset.path, btn.dataset.completed === "true"); break;
      case "delete": deleteRow(btn.dataset.path); break;
      case "goContext": goContext(); break;
      case "option": state.selectedOptionId = state.selectedOptionId === btn.dataset.id ? null : btn.dataset.id; render(); break;
      case "prev": goBack(); break;
      case "submit": submitAnswer(); break;
    }
  });

  modalRoot.addEventListener("input", (e) => {
    if (e.target.id === "answerInput") {
      state.freeText = e.target.value;
      if (state.freeText.trim().length > 0 && state.selectedOptionId !== null) {
        state.selectedOptionId = null;
        render();
      }
    }
  });

  modalRoot.addEventListener("keydown", (e) => {
    if (e.target.id === "answerInput" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitAnswer();
    }
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.open) closeModal();
  });

  // ── Panel de demo ──
  const STATES = [
    { key: "pick", label: "Selector", run: () => goToPick() },
    { key: "interview", label: "Entrevista", run: () => startNew() },
    { key: "synthesizing", label: "Sintetizando", run: () => {
      clearTimeout(state.synthTimer);
      state.busy = false;
      state.phase = "synthesizing";
      render();
      state.synthTimer = setTimeout(() => {
        state.phase = "done";
        state.doneReason = "all_topics_closed";
        state.ledgerPath = ".agents/interview/interview-1755202000000.json";
        render();
      }, 1600);
    }},
    { key: "done", label: "Listo", run: () => {
      clearTimeout(state.synthTimer);
      state.phase = "done";
      state.busy = false;
      state.doneReason = "all_topics_closed";
      state.ledgerPath = ".agents/interview/interview-1755202000000.json";
      render();
    }},
    { key: "error", label: "Error", run: () => {
      clearTimeout(state.synthTimer);
      state.phase = "error";
      state.busy = false;
      state.errorMessage = "El motor de entrevista no respondió: timeout de 60s esperando la pregunta del modelo.";
      render();
    }},
    { key: "nobrief", label: "Sin brief", run: () => {
      state.showBrief = false;
      goToPick();
    }},
    { key: "restore", label: "Restaurar demo", run: () => {
      state.showBrief = true;
      state.summaries = JSON.parse(JSON.stringify(SUMMARIES));
      state.errorMessage = null;
      goToPick();
    }},
  ];

  function renderDemoBar() {
    $("#stateBtns").innerHTML = STATES.map((s) =>
      `<button data-demo="${s.key}">${s.label}</button>`).join("");
    $("#themeBtn").textContent = state.theme === "dark" ? "Tema claro" : "Tema oscuro";
  }

  $("#stateBtns").addEventListener("click", (e) => {
    const b = e.target.closest("[data-demo]");
    if (!b) return;
    const s = STATES.find((x) => x.key === b.dataset.demo);
    if (s) s.run();
    renderDemoBar();
  });

  $("#themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = state.theme;
    renderDemoBar();
  });

  $("#closeOpenBtn").addEventListener("click", () => {
    if (state.open) closeModal(); else { state.open = true; render(); }
    renderDemoBar();
  });

  // ════════════════════════════════════════════════════════════════
  //  INIT
  // ════════════════════════════════════════════════════════════════
  document.documentElement.dataset.theme = state.theme;
  renderDemoBar();
  render();
</script>
</body>
</html>
