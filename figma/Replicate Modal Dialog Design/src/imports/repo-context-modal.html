          { tema: "Verificación de antecedentes de los voluntarios", por_que_importa: "Menores en el programa", impacto_en_diseno: "Flujo de validación antes del primer encuentro" },
        ],
        alertas_consistencia: [],
      },
    },
  ];

  const FAKE_IN_PROGRESS = [
    { ledgerPath: ".agents/interview/ledger-2026-08-14-brief.json", timestamp: "14/8/2026 · 18:47", answers_count: 4, total_questions: 8 },
  ];

  const FAKE_DONE = {
    path: ".agents/interview/brief-2026-08-14-vereda-brief.json",
    brief: {
      resumen_proyecto: "Vereda es una app para que los vecinos reporten y sigan baches, luminarias apagadas y obstrucciones de ramas: foto, ubicación y estado en vivo hasta que el municipio lo resuelve.",
      propuesta_de_valor: "Que el reclamo no quede en el grupo de WhatsApp: cada reporte tiene dueño, estado y fecha de resolución.",
      incertidumbres_criticas: [
        { tema: "¿El municipio se compromete a responder dentro de la app?", por_que_importa: "Sin respuesta oficial el estado 'en gestión' se inventa", impacto_en_diseno: "Modo solo-reporte vs integración con mesas de entrada" },
      ],
      alertas_consistencia: [
        { descripcion: "El dueño quiere moderación comunitaria pero también 'cero fricción al reportar' — los dos requisitos chocan en el flujo de primera publicación.", gravedad: "alta" },
        { descripcion: "Alcance mínimo incluye geolocalización precisa, pero las restricciones no contemplan costo de mapas.", gravedad: "baja" },
      ],
    },
  };

  const state = {
    theme: "dark",
    open: true,
    phase: "idle", // idle | interview | synthesizing | done | error
    view: "list", // list | detail
    briefs: JSON.parse(JSON.stringify(FAKE_BRIEFS)),
    activePath: ".agents/interview/brief-2026-08-10-cosecha-brief.json",
    inProgress: JSON.parse(JSON.stringify(FAKE_IN_PROGRESS)),
    selectedPath: ".agents/interview/brief-2026-08-10-cosecha-brief.json",
    // entrevista
    position: null,
    briefAnswer: "",
    history: [],
    canGoBack: false,
    busy: false,
    briefDone: null,
    briefError: null,
    synthTimer: null,
  };

  // ════════════════════════════════════════════════════════════════
  //  GLYPHS (SVG idénticos a los del componente)
  // ════════════════════════════════════════════════════════════════
  const CLOSE_X = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 3.5L10.5 10.5M10.5 3.5L3.5 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const CHEVRON_R = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3 1.5L6.5 5L3 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHEVRON_L = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M7 1.5L3.5 5L7 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const WARNING = '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" style="color:var(--amber); margin-top:2px; flex-shrink:0"><path d="M7 2L1.5 12h11L7 2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M7 6v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="10.5" r="0.6" fill="currentColor"/></svg>';
  const TRASH = '<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.8a.8.8 0 0 1 .8-.8h2.4a.8.8 0 0 1 .8.8V4M3.2 4l.6 7.2a.8.8 0 0 0 .8.8h4.8a.8.8 0 0 0 .8-.8L10.8 4M5.5 6.5v3.5M8.5 6.5v3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ════════════════════════════════════════════════════════════════
  //  RENDER
  // ════════════════════════════════════════════════════════════════
  const $ = (s) => document.querySelector(s);
  const modalRoot = $("#modalRoot");

  function selected() {
    return state.briefs.find((b) => b.path === state.selectedPath) ?? null;
  }

  function headerHtml() {
    const inInterview = state.phase === "interview" || state.phase === "synthesizing";
    const title = inInterview ? "Entrevista de contexto" : "Contexto del repositorio";
    return `
      <div class="modal-header">
        ${state.phase === "interview" ? `
          <button class="btn btn-danger" data-action="exit" title="Guarda el progreso y vuelve a la lista">Salir</button>
        ` : "<span></span>"}
        <h2 class="tc-display t13">${title}</h2>
        <button class="icon-btn" data-action="close" aria-label="Cerrar">${CLOSE_X}</button>
      </div>`;
  }

  function interviewPhaseHtml() {
    const p = state.position;
    if (!p) return "";
    const canSubmit = !state.busy && state.briefAnswer.trim().length > 0;
    const pct = Math.round((p.respondidas / p.preguntaTotal) * 100);
    return `
      <div class="flex flex-col gap-3">
        <div class="flex items-center justify-between gap-2">
          <p class="tc-caption">Bloque ${p.bloqueNumero}/${p.bloqueTotal} · pregunta ${p.preguntaNumero}/${p.preguntaTotal}</p>
          <p class="tc-caption">${p.respondidas} respondidas</p>
        </div>
        <div class="progress-track"><div class="progress-fill transition-[width]" style="width:${pct}%"></div></div>
        <div class="question-card">
          <p class="tc-caption font-medium uppercase tracking-wide">${p.bloque.titulo}</p>
          <p class="mt-1 t-md" style="color:var(--text-primary)">${p.pregunta}</p>
        </div>
        <textarea id="answerInput" class="textarea" rows="5" placeholder="Tu respuesta… (Enter envía, Shift+Enter nueva línea)"
          ${state.busy ? "disabled" : ""}></textarea>
        <div class="flex items-center justify-end gap-2">
          <button class="btn btn-ghost" data-action="prev" ${state.busy || !state.canGoBack ? "disabled" : ""} title="Volver a la pregunta anterior para revisarla o editarla">← Anterior</button>
          <button class="btn btn-primary" data-action="submit" ${!canSubmit ? "disabled" : ""}>${state.busy ? "Guardando…" : "Guardar y siguiente →"}</button>
        </div>
      </div>`;
  }

  function synthesizingHtml() {
    return `
      <div class="flex flex-1 flex-col items-center justify-center gap-3 py-10 text-center">
        <div class="spinner animate-spin"></div>
        <p class="tc-caption" style="color:var(--text-muted)">Sintetizando el contexto del proyecto… (una llamada)</p>
      </div>`;
  }

  function errorHtml() {
    return `
      <div class="flex flex-col items-center justify-center gap-3 py-10 text-center">
        <p class="tc-caption" style="color:var(--text-secondary); max-width:24rem">${state.briefError ?? "Algo salió mal durante la entrevista de contexto."}</p>
        <button class="btn btn-ghost" data-action="exit">Volver</button>
      </div>`;
  }

  function doneHtml() {
    const b = state.briefDone.brief;
    const nInc = b.incertidumbres_criticas.length;
    return `
      <div class="flex flex-col gap-3">
        <p class="tc-caption" style="color:var(--text-muted)">Contexto del proyecto sintetizado. Revisá el resumen y usalo como contexto del entrevistador de requerimientos:</p>
        <div class="card">
          <p class="t-md" style="color:var(--text-primary)">${esc(b.resumen_proyecto)}</p>
          ${b.propuesta_de_valor ? `
            <div class="mt-3 tint-accent">
              <p class="tc-caption font-medium" style="color:var(--text-secondary)">Propuesta de valor</p>
              <p class="mt-0.5 t12-5 leading-relaxed" style="color:var(--text-primary)">${esc(b.propuesta_de_valor)}</p>
            </div>` : ""}
          ${nInc > 0 ? `
            <div class="mt-2 flex items-start gap-2 tint-amber">
              ${WARNING}
              <p class="t11 leading-snug text-white-on-amber"><span class="font-medium amber-text">${nInc} incertidumbre${nInc !== 1 ? "s" : ""} críticas</span> — temas a definir durante la entrevista de requerimientos.</p>
            </div>` : ""}
          ${b.alertas_consistencia.length > 0 ? `
            <div class="mt-2 flex flex-col gap-1 tint-amber">
              <p class="t11 font-semibold amber-text">Alertas de consistencia</p>
              ${b.alertas_consistencia.map((a) => `<p class="t11 leading-snug text-white-on-amber">[${esc(a.gravedad)}] ${esc(a.descripcion)}</p>`).join("")}
            </div>` : ""}
        </div>
        <div class="mt-1 flex items-center gap-2">
          <button class="btn btn-primary" data-action="useDone">Usar como contexto</button>
          <button class="btn btn-ghost" data-action="exit">Volver</button>
        </div>
      </div>`;
  }

  function listViewHtml() {
    const n = state.briefs.length;
    return `
      <div class="flex items-center justify-between gap-2">
        <p class="tc-caption">${n} contexto${n !== 1 ? "s" : ""} relevado${n !== 1 ? "s" : ""} — elegí el que usa el entrevistador:</p>
        <button class="btn btn-white" data-action="new">+ Nueva entrevista de contexto</button>
      </div>
      <ul class="flex flex-col gap-2" style="list-style:none">
        ${[...state.briefs].reverse().map((item) => {
          const isActive = item.path === state.activePath;
          return `
            <li>
              <button class="row-item ${isActive ? "active" : ""}" data-action="detail" data-path="${esc(item.path)}">
                <span class="flex items-center justify-between gap-2">
                  <span class="eyebrow">${item.timestamp}</span>
                  ${isActive ? `<span class="badge-active">Activo</span>` : ""}
                </span>
                <span class="line-clamp-3 t12-5 leading-relaxed" style="color:var(--text-primary)">${esc(item.brief.resumen_proyecto)}</span>
                <span class="tc-caption inline-flex items-center gap-1 accent-link">Ver detalle ${CHEVRON_R}</span>
              </button>
            </li>`;
        }).join("")}
      </ul>`;
  }

  function detailViewHtml() {
    const item = selected();
    if (!item) return "";
    const isActive = item.path === state.activePath;
    const nInc = item.brief.incertidumbres_criticas.length;
    const showBack = state.briefs.length > 1;
    return `
      <div class="flex flex-col gap-3">
        ${showBack ? `<button class="btn btn-link self-start" data-action="list">${CHEVRON_L} Volver a la lista</button>` : ""}
        <div class="card">
          <div class="flex items-center justify-between gap-2">
            <p class="eyebrow">Relevado el ${item.timestamp}</p>
            ${isActive ? `<span class="badge-active">Activo</span>` : ""}
          </div>
          <p class="mt-2 t-md" style="color:var(--text-primary)">${esc(item.brief.resumen_proyecto)}</p>
          ${item.brief.propuesta_de_valor ? `
            <div class="mt-3 tint-accent">
              <p class="tc-caption font-medium" style="color:var(--text-secondary)">Propuesta de valor</p>
              <p class="mt-0.5 t12-5 leading-relaxed" style="color:var(--text-primary)">${esc(item.brief.propuesta_de_valor)}</p>
            </div>` : ""}
          ${nInc > 0 ? `
            <div class="mt-2 flex items-start gap-2 tint-amber">
              ${WARNING}
              <p class="t11 leading-snug text-white-on-amber"><span class="font-medium amber-text">${nInc} incertidumbre${nInc !== 1 ? "s" : ""} críticas</span> — temas a definir durante la entrevista de requerimientos.</p>
            </div>` : `<p class="tc-caption mt-2" style="color:var(--text-faint)">Sin incertidumbres críticas relevadas.</p>`}
        </div>
        <div class="mt-1 flex items-center gap-2">
          <button class="btn btn-primary" data-action="activate" ${isActive ? "disabled" : ""}>${isActive ? "Ya está activo" : "Marcar como activo"}</button>
        </div>
      </div>`;
  }

  function inProgressHtml() {
    if (!state.inProgress.length) return "";
    return `
      <div class="flex flex-col gap-1.5">
        <h3 class="tc-caption font-medium" style="color:var(--text-secondary)">Entrevista de contexto en progreso</h3>
        <ul class="flex flex-col gap-1.5" style="list-style:none">
          ${state.inProgress.map((item) => {
            const pct = item.total_questions > 0 ? Math.round((item.answers_count / item.total_questions) * 100) : 0;
            return `
              <li>
                <div class="inprog-row">
                  <button class="trash-btn" data-action="del-ledger" data-path="${esc(item.ledgerPath)}" title="Eliminar entrevista de contexto" aria-label="Eliminar entrevista de contexto">${TRASH}</button>
                  <button class="inprog-main" data-action="resume" data-path="${esc(item.ledgerPath)}">
                    <span class="flex min-w-0 flex-col gap-1">
                      <span class="eyebrow">${item.timestamp}</span>
                      <span class="flex items-center gap-2">
                        <span class="progress-track-sm"><span class="progress-fill-sm" style="width:${pct}%"></span></span>
                        <span class="tc-caption" style="color:var(--text-muted)">${item.answers_count}/${item.total_questions} preguntas respondidas</span>
                      </span>
                    </span>
                    <span class="tc-caption shrink-0 accent-link">Continuar →</span>
                  </button>
                </div>
              </li>`;
          }).join("")}
        </ul>
      </div>`;
  }

  function noBriefHtml() {
    return `
      <div class="flex flex-col items-start gap-3">
        <p class="tc-caption" style="color:var(--text-muted)">El contexto del repositorio se releva con una entrevista guiada (Fase 0): misión, problema, usuarios, alcance y valores del proyecto. Ese contexto queda guardado en <code class="t12" style="color:var(--text-secondary)">.agents/interview/brief-*-brief.json</code> y el entrevistador de requerimientos lo usa en cada pregunta.</p>
        <button class="btn btn-primary" data-action="new">Empezar entrevista de contexto</button>
        <p class="tc-caption">Reemplaza al antiguo .agents/repo-context.md escrito a mano.</p>
      </div>`;
  }

  function bodyHtml() {
    if (state.phase === "interview") return interviewPhaseHtml();
    if (state.phase === "synthesizing") return synthesizingHtml();
    if (state.phase === "done" && state.briefDone) return doneHtml();
    if (state.phase === "error") return errorHtml();

    let main = "";
    if (!state.briefs.length) {
      main = noBriefHtml();
    } else if (state.view === "list") {
      main = listViewHtml();
    } else if (selected()) {
      main = detailViewHtml();
    }
    const showInProgress =
      (!state.briefs.length || state.view === "list") && state.inProgress.length > 0;
    const busyNote = state.busy && state.phase === "interview"
      ? '<p class="tc-caption text-center" style="color:var(--text-faint)">Guardando…</p>'
      : "";
    return `${main}${showInProgress ? inProgressHtml() : ""}${busyNote}`;
  }

  function render() {
    if (!state.open) {
      modalRoot.classList.add("hidden");
      modalRoot.innerHTML = "";
      $("#closeOpenBtn").textContent = "Abrir modal";
      return;
    }
    $("#closeOpenBtn").textContent = "Cerrar modal";
    modalRoot.classList.remove("hidden");
    modalRoot.innerHTML = `
      <div class="modal-shell tc-enter-fade-up">
        ${headerHtml()}
        <div class="modal-body">${bodyHtml()}</div>
      </div>`;
    const ta = $("#answerInput");
    if (ta) ta.value = state.briefAnswer;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ════════════════════════════════════════════════════════════════
  //  ACCIONES (espejo de las del store real)
  // ════════════════════════════════════════════════════════════════
  function closeModal() { state.open = false; render(); }

  function startInterview(resumeAt) {
    const idx = resumeAt ?? 0;
    const q = QUESTIONS[idx];
    state.phase = "interview";
    state.position = {
      bloqueNumero: q.bloque,
      bloqueTotal: q.totalBloques,
      preguntaNumero: idx + 1,
      preguntaTotal: q.total,
      respondidas: idx,
      bloque: { titulo: q.bloqueTitulo },
      pregunta: q.pregunta,
    };
    state.briefAnswer = "";
    state.history = [];
    state.canGoBack = false;
    render();
  }

  function submitAnswer() {
    if (state.busy || !state.briefAnswer.trim()) return;
    state.history.push({ pos: { ...state.position }, answer: state.briefAnswer });
    const nextIdx = state.position.preguntaNumero; // 0-based index of next question
    if (nextIdx >= QUESTIONS.length) {
      state.phase = "synthesizing";
      state.position = null;
      state.briefAnswer = "";
      render();
      clearTimeout(state.synthTimer);
      state.synthTimer = setTimeout(() => {
        state.phase = "done";
        state.briefDone = JSON.parse(JSON.stringify(FAKE_DONE));
        render();
      }, 1600);
      return;
    }
    const q = QUESTIONS[nextIdx];
    state.position = {
      bloqueNumero: q.bloque,
      bloqueTotal: q.totalBloques,
      preguntaNumero: nextIdx + 1,
      preguntaTotal: q.total,
      respondidas: nextIdx,
      bloque: { titulo: q.bloqueTitulo },
      pregunta: q.pregunta,
    };
    state.briefAnswer = "";
    state.canGoBack = state.history.length > 0;
    render();
  }

  function goBack() {
    const prev = state.history.pop();
    if (!prev) return;
    state.position = prev.pos;
    state.briefAnswer = prev.answer;
    state.canGoBack = state.history.length > 0;
    render();
  }

  function exitInterview() {
    state.phase = "idle";
    state.position = null;
    state.briefAnswer = "";
    state.history = [];
    state.canGoBack = false;
    state.briefDone = null;
    state.briefError = null;
    state.view = "list";
    render();
  }

  function useDoneAsContext() {
    const done = state.briefDone;
    if (!done) return;
    state.briefs.push({ path: done.path, timestamp: "14/8/2026 · 18:59", brief: done.brief });
    state.activePath = done.path;
    state.selectedPath = done.path;
    state.phase = "idle";
    state.briefDone = null;
    state.view = "detail";
    render();
  }

  function activateSelected() {
    state.activePath = state.selectedPath;
    render();
  }

  function deleteLedger(path) {
    if (!confirm("¿Eliminar esta entrevista de contexto? Las respuestas se borran del disco.")) return;
    state.inProgress = state.inProgress.filter((i) => i.ledgerPath !== path);
    render();
  }

  function resumeLedger(path) {
    const item = state.inProgress.find((i) => i.ledgerPath === path);
    startInterview(item ? item.answers_count : 0);
  }

  function forceState(phase, view) {
    clearTimeout(state.synthTimer);
    state.phase = phase;
    state.view = view;
    state.position = null;
    state.briefAnswer = "";
    state.history = [];
    state.canGoBack = false;
    state.briefDone = phase === "done" ? JSON.parse(JSON.stringify(FAKE_DONE)) : null;
    state.briefError = phase === "error" ? "El motor de entrevista no respondió: timeout de 60s esperando la síntesis del brief." : null;
    if (phase === "synthesizing") {
      clearTimeout(state.synthTimer);
      state.synthTimer = setTimeout(() => {
        state.phase = "done";
        state.briefDone = JSON.parse(JSON.stringify(FAKE_DONE));
        render();
      }, 1600);
    }
    render();
  }

  // ════════════════════════════════════════════════════════════════
  //  EVENTOS
  // ════════════════════════════════════════════════════════════════
  modalRoot.addEventListener("click", (e) => {
    if (e.target === modalRoot) { closeModal(); return; }
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    switch (btn.dataset.action) {
      case "close": closeModal(); break;
      case "exit": exitInterview(); break;
      case "list": state.view = "list"; render(); break;
      case "detail": state.selectedPath = btn.dataset.path; state.view = "detail"; render(); break;
      case "activate": activateSelected(); break;
      case "new": startInterview(0); break;
      case "submit": submitAnswer(); break;
      case "prev": goBack(); break;
      case "resume": resumeLedger(btn.dataset.path); break;
      case "del-ledger": deleteLedger(btn.dataset.path); break;
      case "useDone": useDoneAsContext(); break;
    }
  });

  modalRoot.addEventListener("input", (e) => {
    if (e.target.id === "answerInput") state.briefAnswer = e.target.value;
  });

  modalRoot.addEventListener("keydown", (e) => {
    if (e.target.id === "answerInput" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitAnswer();
    }
  });

  // ── Panel de demo ──
  const STATES = [
    { key: "idle-list", label: "Lista", run: () => forceState("idle", "list") },
    { key: "idle-detail", label: "Detalle", run: () => forceState("idle", "detail") },
    { key: "interview", label: "Entrevista", run: () => startInterview(3) },
    { key: "synthesizing", label: "Sintetizando", run: () => forceState("synthesizing", "list") },
    { key: "done", label: "Listo", run: () => forceState("done", "list") },
    { key: "error", label: "Error", run: () => forceState("error", "list") },
    { key: "empty", label: "Sin brief", run: () => {
      clearTimeout(state.synthTimer);
      state.phase = "idle"; state.view = "list";
      state.briefs = []; state.inProgress = [];
      state.briefDone = null; state.briefError = null; state.position = null;
      render();
    }},
    { key: "restore", label: "Restaurar demo", run: () => {
      clearTimeout(state.synthTimer);
      state.phase = "idle"; state.view = "list";
      state.briefs = JSON.parse(JSON.stringify(FAKE_BRIEFS));
      state.activePath = FAKE_BRIEFS[0].path;
      state.inProgress = JSON.parse(JSON.stringify(FAKE_IN_PROGRESS));
      state.selectedPath = FAKE_BRIEFS[0].path;
      state.briefDone = null; state.briefError = null; state.position = null;
      render();
    }},
  ];

  function renderDemoBar() {
    const btns = $("#stateBtns");
    btns.innerHTML = STATES.map((s) =>
      `<button data-demo="${s.key}">${s.label}</button>`).join("");
    $("#themeBtn").textContent = state.theme === "dark" ? "Tema claro" : "Tema oscuro";
  }

  $("#stateBtns").addEventListener("click", (e) => {
    const b = e.target.closest("[data-demo]");
    if (!b) return;
    const s = STATES.find((x) => x.key === b.dataset.demo);
    if (s) s.run();
    renderDemoBar();
  });

  $("#themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = state.theme;
    renderDemoBar();
  });

  $("#closeOpenBtn").addEventListener("click", () => {
    if (state.open) closeModal(); else { state.open = true; render(); }
    renderDemoBar();
  });

  // ════════════════════════════════════════════════════════════════
  //  INIT
  // ════════════════════════════════════════════════════════════════
  document.documentElement.dataset.theme = state.theme;
  renderDemoBar();
  render();
</script>
</body>
</html>
